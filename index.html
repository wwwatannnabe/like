<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分類テスト</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            text-align: center;
        }

        /* メインの3つのボタン（赤、青、黄の大きな円） */
        .main-buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .circle-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 赤（米） */
        .btn-rice { background-color: #ff4d4d; }
        /* 青（パン） */
        .btn-bread { background-color: #4da6ff; }
        /* 黄（麺） */
        .btn-noodle { background-color: #ffcc00; color: #333; }

        /* サブ項目の表示エリア */
        .sub-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            min-height: 80px;
        }

        .sub-group {
            display: none; /* 初期状態は非表示 */
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .sub-group.active {
            display: flex; /* 選択されたら表示 */
        }

        .sub-circle-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* サブの色の微調整（似た系統の色） */
        .sub-red { background-color: #ff8080; }
        .sub-blue { background-color: #80c2ff; }
        .sub-yellow { background-color: #ffe066; color: #333; }

        /* 説明欄エリア */
        #description-box {
            border: 1px solid #ccc;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            text-align: left;
            min-height: 50px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>分類メニュー</h1>

    <!-- メインボタン（米、パン、麺） -->
    <div class="main-buttons">
        <button class="circle-btn btn-rice" onclick="showSub('rice')">米</button>
        <button class="circle-btn btn-bread" onclick="showSub('bread')">パン</button>
        <button class="circle-btn btn-noodle" onclick="showSub('noodle')">麺</button>
    </div>

    <!-- サブ項目エリア -->
    <div class="sub-container">
        <!-- 米のサブ項目 -->
        <div id="sub-rice" class="sub-group">
            <button class="sub-circle-btn sub-red" onclick="showDesc('どんぶり', 'どんぶりは、ご飯の上に具材をのせた料理です。')">どんぶり</button>
            <button class="sub-circle-btn sub-red" onclick="showDesc('カレー', 'カレーは、スパイスで味付けしたソースをご飯にかけて食べます。')">カレー</button>
            <button class="sub-circle-btn sub-red" onclick="showDesc('すし', 'すしは、酢飯に魚介類などを合わせた料理です。')">すし</button>
        </div>

        <!-- パンのサブ項目 -->
        <div id="sub-bread" class="sub-group">
            <button class="sub-circle-btn sub-blue" onclick="showDesc('サンドイッチ', 'サンドイッチは、パンで具材を挟んだ料理です。')">サンド</button>
            <button class="sub-circle-btn sub-blue" onclick="showDesc('トースト', 'トーストは、パンを焼いたものです。')">トースト</button>
            <button class="sub-circle-btn sub-blue" onclick="showDesc('ハンバーガー', 'ハンバーガーは、パンで肉などを挟んだファストフードです。')">バーガー</button>
        </div>

        <!-- 麺のサブ項目 -->
        <div id="sub-noodle" class="sub-group">
            <button class="sub-circle-btn sub-yellow" onclick="showDesc('ラーメン', 'ラーメンは、スープに入った中華麺です。')">ラーメン</button>
            <button class="sub-circle-btn sub-yellow" onclick="showDesc('うどん', 'うどんは、小麦粉から作られる太い麺です。')">うどん</button>
            <button class="sub-circle-btn sub-yellow" onclick="showDesc('パスタ', 'パスタは、イタリア発祥の麺料理です。')">パスタ</button>
        </div>
    </div>

    <!-- 説明欄 -->
    <div id="description-box">
        <h3>説明</h3>
        <p id="desc-text">上のボタンを押してください。</p>
    </div>

    <script>
        // メインボタンを押した時の処理（サブ項目の切り替え）
        function showSub(category) {
            // 一度すべてのサブグループを非表示にする
            document.querySelectorAll('.sub-group').forEach(el => {
                el.classList.remove('active');
            });

            // 選択されたカテゴリのサブグループを表示する
            document.getElementById('sub-' + category).classList.add('active');

            // 説明欄をリセット
            document.getElementById('desc-text').innerText = '項目を選んでください。';
        }

        // サブ項目を押した時の処理（説明文の表示）
        function showDesc(title, text) {
            document.getElementById('desc-text').innerHTML = '<strong>' + title + '</strong><br>' + text;
        }
    </script>

</body>
</html>
