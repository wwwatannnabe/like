<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わたしのWebサイト</title>
    <!-- Google Fontsからフォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 全体のデザインと動き */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* メインのカード */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* アイコン（絵文字） */
        .avatar {
            font-size: 80px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* タイトル・自己紹介 */
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* リンクボタンたち */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            background: #fff;
            color: #4a5568;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            background: #ff758c;
            color: #fff;
        }

        /* フッター */
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- アイコンは好きな絵文字に変えてね -->
        <div class="avatar">🐱</div>
        
        <h1>こんにちは、〇〇です！</h1>
        <p>GitHub Pagesで作ったてきとうなウェブサイトです。<br>趣味や好きなものを発信していきます✨</p>

        <div class="links">
            <!-- リンク先を自分のSNSやブログに変えてね -->
            <a href="https://twitter.com" class="btn" target="_blank">💬 X (Twitter)</a>
            <a href="https://github.com" class="btn" target="_blank">🐙 GitHub</a>
            <a href="https://note.com" class="btn" target="_blank">📝 Note / ブログ</a>
            <a href="https://example.com" class="btn" target="_blank">🔗 その他のリンク</a>
        </div>

        <footer>
            &copy; 2026 My Web Site
        </footer>
    </div>

</body>
</html>
